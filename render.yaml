services:
  - type: web
    name: profit-pilots-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FORCE_LIVE_MARKET_OPEN
        value: "0"

